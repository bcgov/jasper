<!DOCTYPE html>
<html>
  <head>
    <title>Base64 PDF Viewer</title>
  </head>
  <body style="margin:0;font-family:sans-serif;">
    <div style="padding:8px;">
      <textarea id="input" rows="6" style="width:100%;" placeholder="Paste base64 PDF string here (with or without the data:application/pdf;base64, prefix)"></textarea>
      <button onclick="render()">View PDF</button>
    </div>
    <iframe id="frame" style="width:100%;height:90vh;border:none;"></iframe>
    <script>
      function render() {
        let value = document.getElementById('input').value.trim();
        if (!value.startsWith('data:')) {
          value = 'data:application/pdf;base64,' + value;
        }
        document.getElementById('frame').src = value;
      }
    </script>
  </body>
</html>
